<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Paper Kingdom — an animated story</title>
<meta name="description" content="An animated story for children, told in a world made of paper. Press play and watch.">
<meta name="theme-color" content="#fdf6e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#21262c" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Magic Pencil: Kingdoms of Paper">
<meta property="og:title" content="Magic Pencil: Kingdoms of Paper">
<meta property="og:description" content="Draw it. Name it. It comes alive. A browser game about a magic pencil, six paper kingdoms and a great many dragons.">
<meta property="og:image" content="assets/img/og.svg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/sections.css">

<script>
  /* Mark the runtime present and apply the saved lamp before first paint. */
  (function () {
    document.documentElement.classList.add('js');
      if (window.speechSynthesis) document.documentElement.classList.add('can-speak');
    try {
      var t = localStorage.getItem('mp-theme');
      if (t === 'day' || t === 'night') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<main id="main">
<section id="film-page" class="film">
  <!-- the picture fills everything; the words sit on top of it -->
  <canvas id="film" class="film__canvas" role="img"
          aria-label="An animated story about a kingdom made of paper"></canvas>

  <div class="film__over">
    <h1 class="film__title" id="film-title" data-narrate data-narrate-label="The Paper Kingdom">The Paper Kingdom</h1>
    <p class="film__caption" id="film-caption" aria-live="polite"></p>
  </div>

  <button class="film__big" id="film-big" type="button" aria-label="Play the story">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M36 24 L78 50 L36 76 Z"/></svg>
  </button>

  <div class="film__controls" role="group" aria-label="Story controls">
    <button class="film__btn film__btn--go" id="film-play" type="button" aria-pressed="false">Play</button>
    <button class="film__btn" id="film-replay" type="button">Start again</button>
    <button class="film__btn" id="film-captions" type="button" aria-pressed="true">Words on</button>
    <div class="film__bar" id="film-bar" aria-hidden="true"><i></i></div>
    <span class="film__scene" id="film-scene">1 / 10</span>
  </div>
</section>
</main>

<script src="assets/js/site.js" defer></script>
<script src="assets/js/rig.js" defer></script>
<script src="assets/js/movie.js" defer></script>
</body>
</html>
